name: Update Game Compatibility Database

on:
  schedule:
    # Run every Wednesday at 00:00 UTC
    - cron: '0 0 * * 3'
  workflow_dispatch: # Allows manual triggering

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Fetch and Parse PCGamingWiki Data
      run: node update-pcgw-games.js

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add developer-games.json
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-update game compatibility database from PCGamingWiki"
          git push
        else
          echo "No changes to commit."
        fi
